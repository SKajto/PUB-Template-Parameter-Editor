# Trusted release packaging. Never holds Store credentials.
# Runs only for maintainer-triggered work or tags on the protected default branch;
# PR code is not executed here. Requires the 'release-packaging' environment so a
# maintainer must approve the run (Settings -> Environments -> protection rules).
#
# The signing job implements the SignPath Foundation conditions for open source projects
# (https://signpath.org/terms, see docs/CODE_SIGNING_POLICY.md): the binary is built by CI from
# this repository's source, one release equals one signing request, the request needs a manual
# approval by an Approver through the protected 'signing-signpath' environment, the executable's
# file metadata is set and verified to match the release version, and only artifacts of this
# project are ever signed.
#
# Free GitHub plan: the repository is public, so this Windows job runs on the free GitHub-hosted
# runner under the fair-use policy for public repositories. It stays deliberately single-runner -
# no build matrix, no larger runners, no self-hosted machine - and the artifact retention is 90
# days, which is inside the free plan's storage allowance for a project of this size.
#
# Pinned action SHAs are the same verified refs as .github/workflows/ci.yml, plus
#   signpath/github-action-submit-signing-request  v3.0
#     f6d04783b4569d051e0c80105fe66e82819d0092   (resolved from the GitHub tags API 2026-10-26)

name: Release packaging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to package (must be the released commit)
        required: true
        default: main
      appVersion:
        description: App version MAJOR.MINOR.PATCH (MSIX version becomes MAJOR.MINOR.PATCH.0)
        required: true
        default: 0.1.0
      includeStorePackage:
        description: Build the MSIX for Store submission too (needs the real Partner Center values)
        type: choice
        required: true
        options:
          - 'true'
          - 'false'
        default: 'true'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate, build and package the release
    runs-on: windows-latest
    environment: release-packaging

    outputs:
      appVersion: ${{ steps.version.outputs.appVersion }}
      packageVersion: ${{ steps.version.outputs.packageVersion }}
      # The unsigned payload travels to the signer as its own artifact; SignPath's action picks it
      # up by id, so what gets signed is exactly what this job built.
      payloadArtifactId: ${{ steps.unsigned_payload.outputs.artifact-id }}
      payloadSha256: ${{ steps.payload_hash.outputs.sha256 }}

    steps:
      - name: Resolve and validate the version inputs
        id: version
        run: |
          $raw = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.appVersion }}' }
                 else { '${{ github.ref_name }}'.Substring(1) }
          if ($raw -notmatch '^\d+\.\d+\.\d+$') { throw "appVersion '$raw' must be MAJOR.MINOR.PATCH" }
          "appVersion=$raw" >> $env:GITHUB_OUTPUT
          "packageVersion=$raw.0" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # A tag push checks out the tag itself; a manual run uses the given ref.

      - name: Install .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Build
        run: |
          dotnet restore PubTemplateEditor.slnx
          dotnet build PubTemplateEditor.slnx -c Release --no-restore
        shell: pwsh

      - name: Test
        run: |
          dotnet test tests/PubTemplateEditor.Core.Tests -c Release --no-build
          dotnet test tests/PubTemplateEditor.Integration.Tests -c Release --no-build
          dotnet test tests/PubTemplateEditor.App.Tests -c Release --no-build
        shell: pwsh

      - name: Reject unresolved identity in a submission build (REL-04)
        if: inputs.includeStorePackage != 'false'
        run: |
          $settings = Get-Content packaging/StoreRelease.settings.json -Raw | ConvertFrom-Json
          $bad = @($settings.PSObject.Properties | Where-Object {
              $_.Value -is [string] -and ($_.Value -like 'REPLACE_*' -or -not $_.Value)
          })
          if ($bad) {
            throw "unresolved release configuration: $($bad.Name -join ', ') - fill in the real Partner Center values first"
          }
        shell: pwsh

      - name: No template content may be published
        run: |
          $templates = git ls-files | Where-Object { $_ -match '\.dta$' }
          if ($templates) { throw "template content is tracked in git: $($templates -join ', ')" }
        shell: pwsh

      - name: Package MSIX for Store submission (unsigned at build time)
        if: inputs.includeStorePackage != 'false'
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build-msix.ps1
          -Version ${{ steps.version.outputs.appVersion }} -Mode Strict
        shell: pwsh

      # One version everywhere: SignPath's artifact configuration requires the product name to be
      # the project name and the product version to be the same in every file of a build, so the
      # release version is passed in and the produced executable is then read back and checked.
      - name: Publish portable single-file EXE (separate, never Store-signed)
        run: >
          dotnet publish src/PubTemplateEditor.App/PubTemplateEditor.App.csproj
          -c Release -p:PublishProfile=PortableWin_x64
          -p:Version=${{ steps.version.outputs.appVersion }}
          -p:AssemblyVersion=${{ steps.version.outputs.appVersion }}
          -p:FileVersion=${{ steps.version.outputs.appVersion }}
          -p:InformationalVersion=${{ steps.version.outputs.appVersion }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o artifacts/publish/portable-win-x64
        shell: pwsh

      - name: File metadata of the payload (SignPath artifact configuration)
        run: |
          $exe = 'artifacts/publish/portable-win-x64/PUB_Template_Parameter_Editor.exe'
          $info = (Get-Item $exe).VersionInfo
          'productName={0}' -f $info.ProductName | Tee-Object -FilePath artifacts/file-metadata.txt
          'productVersion={0}' -f $info.ProductVersion | Tee-Object -FilePath artifacts/file-metadata.txt -Append
          'fileVersion={0}' -f $info.FileVersion | Tee-Object -FilePath artifacts/file-metadata.txt -Append
          if ($info.ProductName -ne 'PUB Template Parameter Editor') {
            throw "product name must be the project name, got '$($info.ProductName)'"
          }
          $expected = '${{ steps.version.outputs.appVersion }}'
          if ($info.ProductVersion -ne $expected -or $info.FileVersion -ne $expected) {
            throw "version metadata must be $expected, got ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          }
        shell: pwsh

      - name: Record the hash of the unsigned payload
        id: payload_hash
        run: |
          $exe = 'artifacts/publish/portable-win-x64/PUB_Template_Parameter_Editor.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "unsigned payload: $hash  $exe" | Tee-Object artifacts/unsigned-payload.txt
        shell: pwsh

      - name: Upload the unsigned payload for signing
        id: unsigned_payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-portable-${{ steps.version.outputs.appVersion }}
          path: artifacts/publish/portable-win-x64/PUB_Template_Parameter_Editor.exe
          retention-days: 90
          if-no-files-found: error

      - name: Corresponding source archive (GPL obligation)
        run: |
          New-Item -ItemType Directory -Force artifacts/source | Out-Null
          git archive --format=tar.gz -o artifacts/source/PUB_Template_Parameter_Editor-${{ steps.version.outputs.appVersion }}-source.tar.gz HEAD
          git rev-parse HEAD | Tee-Object artifacts/source/commit.txt
        shell: pwsh

      - name: Notices shipped with the binaries
        run: |
          New-Item -ItemType Directory -Force artifacts/notices | Out-Null
          Copy-Item LICENSE,NOTICE artifacts/notices/
          dotnet publish src/PubTemplateEditor.App/PubTemplateEditor.App.csproj -c Release `
            -p:PublishProfile=StoreMsixWin_x64 -o artifacts/tmp-notice --no-build | Out-Null
          Get-ChildItem artifacts/tmp-notice -Filter *.txt | Copy-Item -Destination artifacts/notices/ -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifacts/tmp-notice -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Hashes and provenance
        run: |
          Get-ChildItem artifacts -Recurse -Include *.msix,*.exe,*.tar.gz |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.FullName.Replace("$PWD\", '') } |
            Tee-Object artifacts/SHA256SUMS.txt
          'commit: ' + (git rev-parse HEAD) | Tee-Object -Append artifacts/SHA256SUMS.txt
          'dotnet: ' + (dotnet --version) | Tee-Object -Append artifacts/SHA256SUMS.txt
        shell: pwsh

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.appVersion }}
          path: |
            artifacts/packaging/out
            artifacts/publish/portable-win-x64
            artifacts/source
            artifacts/notices
            artifacts/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # SignPath Foundation signing of the downloadable executable.
  #
  # Only the portable EXE that this repository serves needs a third-party signature: the Microsoft
  # Store signs the MSIX itself after Partner Center certification, so the Store payload is built
  # unsigned here and must never be described as SignPath-signed or Store-signed by this workflow.
  #
  # The conditions at https://signpath.org/terms are implemented as follows, and documented in
  # docs/CODE_SIGNING_POLICY.md:
  #   - the binary comes from this repository's own CI build of its own source (no prebuilt input);
  #   - exactly one release equals one signing request, submitted by the maintainers themselves;
  #   - every request needs a manual approval by an Approver, which is the required-reviewer rule of
  #     the 'signing-signpath' environment - the token is only available to that approved job;
  #   - the file metadata (product name, one version across the build) is set and verified before
  #     signing, and SignPath's artifact configuration enforces the same rule on their side;
  #   - pull-request code never runs in a job that can see the SignPath token.
  #
  # Configuration the owner sets after SignPath approved the project (repository variables, plus one
  # environment secret): SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG,
  # SIGNPATH_ARTIFACT_CONFIGURATION_SLUG, secret SIGNPATH_API_TOKEN in environment 'signing-signpath',
  # and SIGNPATH_ENABLED=true to switch this job on.
  sign-portable-exe:
    name: Sign the downloadable EXE (SignPath Foundation)
    runs-on: ubuntu-latest
    needs: package
    if: vars.SIGNPATH_ENABLED == 'true'
    environment:
      name: signing-signpath
      url: ${{ steps.request.outputs.signing-request-web-url }}
    permissions:
      contents: read
      actions: read          # the action reads the unsigned artifact produced by the package job

    steps:
      - name: Require the SignPath project configuration
        env:
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          ARTIFACT: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          missing=()
          [ -n "$ORGANIZATION" ] || missing+=("variable SIGNPATH_ORGANIZATION_ID")
          [ -n "$PROJECT" ]      || missing+=("variable SIGNPATH_PROJECT_SLUG")
          [ -n "$POLICY" ]       || missing+=("variable SIGNPATH_SIGNING_POLICY_SLUG")
          # The artifact configuration is where SignPath holds the file metadata restrictions that
          # the free Foundation certificates require, so signing without it is refused.
          [ -n "$ARTIFACT" ]     || missing+=("variable SIGNPATH_ARTIFACT_CONFIGURATION_SLUG")
          [ -n "$TOKEN" ]        || missing+=("secret SIGNPATH_API_TOKEN in environment signing-signpath")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "SignPath signing is enabled but not configured. Missing:"
            printf '  - %s\n' "${missing[@]}"
            echo "Register the project first: https://signpath.org/terms - and see docs/CODE_SIGNING_POLICY.md"
            exit 1
          fi
        shell: bash

      - name: Submit the signing request for this release's payload
        id: request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ needs.package.outputs.payloadArtifactId }}'
          wait-for-completion: true
          # An Approver must approve the request in SignPath as well as the environment run above:
          # leave enough time for a human to look at it.
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: signed-portable

      - name: Record the signed payload and its identity
        run: |
          set -eu
          mkdir -p artifacts-signed
          exe=$(find signed-portable -type f -name '*.exe' -print -quit)
          if [ -z "${exe:-}" ]; then
            echo "the signed artifact contains no executable:"; find signed-portable -type f; exit 1
          fi
          unsigned='${{ needs.package.outputs.payloadSha256 }}'
          signed=$(sha256sum "$exe" | cut -d' ' -f1 | tr 'a-z' 'A-Z')
          {
            echo "release:            ${{ needs.package.outputs.appVersion }}"
            echo "commit:             ${{ github.sha }}"
            echo "unsigned sha256:    $unsigned"
            echo "signed sha256:      $signed"
            echo "signing request:    ${{ steps.request.outputs.signing-request-web-url }}"
            echo "signed by:          SignPath.io, certificate by SignPath Foundation"
            echo "not signed here:    the MSIX - the Store signs it after certification"
          } | tee artifacts-signed/SIGNING.txt
        shell: bash
        continue-on-error: false

      - name: Upload the signed payload (signed by SignPath Foundation, not by the Store)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-portable-${{ needs.package.outputs.appVersion }}
          path: |
            signed-portable
            artifacts-signed/SIGNING.txt
          retention-days: 90
          if-no-files-found: error
